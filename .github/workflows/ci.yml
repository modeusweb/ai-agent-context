name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a pinned repository that stops being cloneable, or a third-party
  # change that breaks resolution, is noticed even when nothing is pushed.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full suite. The tests are TypeScript and run through Node's native type
  # stripping, which needs 22.18+ (unflagged) — so the matrix starts there.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: node --test "packages/core/test/**/*.test.ts" "packages/cli/test/**/*.test.ts" "packages/mcp/test/**/*.test.ts"

  # Proves the `engines.node >= 20.11.0` claim instead of assuming it.
  #
  # The published packages ship compiled JavaScript, so they run on Node 20 even
  # though the repository's own test suite cannot: the tests are .ts files and
  # need Node's native type stripping. `npm run smoke` packs every package,
  # installs the tarballs into a clean project and drives the CLI and the MCP
  # server over stdio — against what users actually install, not the workspace.
  packaged-smoke:
    name: packaged smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11.0', '22.18', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run smoke

  # The exported symbols of each package are a contract. This job fails when a
  # refactor adds, renames or removes one without the lock being updated, which
  # is what turns "we do not break the API" from a promise into a check.
  api-surface:
    name: api surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The public API must match the lock
        run: node tools/api-surface.mjs

  # Checks the dependency graph against an independent resolver: the TypeScript
  # compiler. The analyzer reporting on itself can only ever agree with itself,
  # so the headline resolution rate needs a second opinion that can disagree.
  ground-truth:
    name: dependency graph vs typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare the graph with the compiler
        run: node tools/ground-truth.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  self-scan:
    name: self scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tool must produce a usable context for its own repository; this also
      # keeps the committed context from silently rotting.
      - name: Scan this repository
        run: node packages/cli/dist/bin.js init && node packages/cli/dist/bin.js scan
      - name: Verify the generated context is not stale
        run: node packages/cli/dist/bin.js verify --json

      # `detect` exits 1 when it finds warnings, and this repository genuinely
      # has import cycles and a layering finding, so the exit code is expected.
      # Only an error (a rejected path traversal) may fail the build.
      - name: Report analysis coverage gaps
        run: node packages/cli/dist/bin.js detect --json > /tmp/detect.json || true
      - name: Fail if a path traversal was not rejected
        run: |
          node -e "
            const r = require('/tmp/detect.json');
            console.log('errors=' + r.counts.error, 'warnings=' + r.counts.warning, 'resolutionRate=' + r.imports.resolutionRate);
            if (r.imports.pathEscapes > 0) { console.error('path traversal was not rejected'); process.exit(1); }
          "

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure resolution rate and token budget
        run: node tools/benchmark.mjs > /tmp/benchmark.json
      - name: Fail if a path traversal was not rejected
        run: |
          node -e "
            const s = require('/tmp/benchmark.json').summary;
            console.log('import resolution rate:', s.imports.resolutionRate);
            console.log('actionable unresolved:', s.imports.actionableUnresolved);
            console.log('path escapes:', s.imports.pathEscapes);
            for (const k of ['under8Kb','from8To64Kb','over64Kb']) {
              const b = s.tokenBudget[k];
              if (b.modules > 0) console.log(k, b.modules, 'modules:', b.savedPercent + '%');
            }
            if (s.imports.pathEscapes > 0) { console.error('path traversal was not rejected'); process.exit(1); }
          "
      # The project commits .agent/ and diffs it across releases, so a context
      # that varies without the repository varying is a defect. `determinism`
      # is measured over two independent scans with the cache bypassed.
      - name: Fail if any repository produced non-deterministic context
        run: |
          node -e "
            const s = require('/tmp/benchmark.json').summary;
            console.log('evidence coverage:', s.trust.coveragePercent + '%', 'of', s.trust.judgements, 'judgements');
            if (s.trust.withoutEvidence > 0) {
              console.error(s.trust.withoutEvidence + ' judgement(s) carry no evidence');
              process.exit(1);
            }
            if (s.trust.nonDeterministic > 0) {
              console.error(s.trust.nonDeterministic + ' repository/repositories produced non-deterministic context');
              process.exit(1);
            }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: /tmp/benchmark.json

  # Evidence on other people's code.
  #
  # Every other job measures a repository we wrote the analyzer for. A defect
  # that only exists in third-party code would pass all of them, which is not a
  # theoretical concern: this job is what caught the nested-generic parser bug
  # that silently dropped every import in a file after one annotation.
  #
  # It needs the network, so it does not run on pull requests. A slow or
  # unreachable clone should not block a change that can be reviewed without it.
  public-evidence:
    name: public repositories
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure the pinned third-party repositories
        run: node tools/benchmark.mjs --public > /tmp/public-benchmark.json
      # Measuring fewer repositories than the manifest pins would be the worst
      # possible outcome here: the job would go green while quietly checking
      # less than it claims.
      - name: Fail if a pinned repository was missed or escaped its root
        run: |
          node -e "
            const p = require('/tmp/public-benchmark.json').public;
            console.log('measured ' + p.measured + '/' + p.requested + ' pinned repositories');
            for (const r of p.repositories) {
              if (r.error) { console.error(r.name + ': ' + r.error); process.exitCode = 1; continue; }
              console.log(r.name.padEnd(14), String(r.files).padStart(4) + ' files', 'resolution ' + r.resolutionRate, 'escapes ' + r.pathEscapes);
              if (r.pathEscapes > 0) { console.error(r.name + ': a path traversal was not rejected'); process.exitCode = 1; }
            }
            if (p.measured !== p.requested) { console.error('not every pinned repository was measured'); process.exitCode = 1; }
          "
      - name: Compare each graph with the TypeScript compiler
        run: node tools/ground-truth-public.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: public-benchmark
          path: /tmp/public-benchmark.json

  publish-check:
    name: publish dry run
    runs-on: ubuntu-latest
    needs: [test, packaged-smoke, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm every package can be packed
        run: |
          # `npm pack --pack-destination` does not create the directory, and a
          # fresh runner has no /tmp/pack, so every pack failed with ENOENT.
          mkdir -p /tmp/pack
          npm pack ./packages/core --pack-destination /tmp/pack
          npm pack ./packages/cli  --pack-destination /tmp/pack
          npm pack ./packages/mcp  --pack-destination /tmp/pack